# --- Prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Shell ---
set-option -g default-shell /usr/bin/zsh

set -g set-clipboard on

# --- Mouse ---
set -g mouse on
set -s escape-time 0

# --- Splits ---
bind | split-window -h
bind - split-window -v

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "Reloaded"

# --- Index ---
set -g base-index 1
setw -g pane-base-index 1

# --- Status bar ---
set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-interval 5
set -g status-left-length 50
set -g status-right-length 100
set -g status-style bg=#1e1e2e,fg=#cdd6f4

# Left: session name + user
set -g status-left "#[fg=#a6e3a1,bold] #S #[fg=#89b4fa]| #[fg=#cdd6f4]#(whoami) "

# Right: time + hostname + uptime
set -g status-right "#[fg=#f9e2af]%H:%M #[fg=#89b4fa]#H #[fg=#cdd6f4]| #[fg=#a6e3a1]#(uptime | cut -d ',' -f 1) "

# Window tabs
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W "

# Pane border styling
set -g pane-border-style fg=#45475a
set -g pane-active-border-style fg=#a6e3a1

# Message styling
set -g message-style bg=#313244,fg=#cdd6f4
set -g mode-style bg=#a6e3a1,fg=#1e1e2e

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Auto restore/save ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- Initialize TPM ---
run '~/.tmux/plugins/tpm/tpm'
