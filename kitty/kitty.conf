
# Font
font_family JetBrainsMono Nerd Font
font_size 12.0

# Window
hide_window_decorations yes
window_padding_width 10
override_redirect yes
background_opacity 0.9
background_blur 10
inactive_text_alpha 0.8

# Performance
repaint_delay 10
scrollback_lines 20000
enable_audio_bell no

# Cursor
cursor_shape block
cursor_blink_interval 0

# Clipboard
copy_on_select yes

# Tabs (tmux handles sessions, but kitty tabs available as fallback)
tab_bar_edge top
tab_bar_style powerline

# Shell: auto-start tmux, attach to existing session
shell tmux new -A -s main
